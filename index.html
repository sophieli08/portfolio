<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sophie Li</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main img { max-width: 100%; max-height: 80vh; }
    footer {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 24px;
    }
    footer img { width: 28px; height: 28px; opacity: 0.15; transition: opacity 0.2s; }
    footer a:hover img { opacity: 0.4; }
  </style>
</head>
<body>
  <main>
    <img src="assets/under-construction.png" alt="Under construction">
  </main>
  <footer>
    <a href="https://github.com/sophieli08" target="_blank" rel="noopener">
      <img src="assets/footer/github-logo.svg" alt="GitHub">
    </a>
    <a href="https://instagram.com/soph.l.i" target="_blank" rel="noopener">
      <img src="assets/footer/instagram-logo.svg" alt="Instagram">
    </a>
  </footer>
</body>
</html>
