<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">  <!-- light only; stops browsers from auto-darkening it -->
  <title>Sophie Li</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap">
  <link rel="stylesheet" href="assets/css/spotify.css">
  <link rel="stylesheet" href="assets/css/progress.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* typography: the hand-lettered calligraphy plus EB Garamond for everything else. The
       script already slants, so the Garamond is mostly upright, with italics (never bold) for
       emphasis, to contrast with the lettering instead of echoing it */
    :root { --serif: "EB Garamond", Garamond, "Times New Roman", serif; }
    /* one text size used everywhere (smaller on phones, see the phone section) */
    :root { --text: 17px; --text-lh: 22px; }
    body {
      position: relative;          /* the header and footer are placed against the whole page */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      font-family: var(--serif);
      font-variant-numeric: lining-nums;  /* Garamond's old-style figures bounce around; keep digits even */
    }
    /* soft glows in the top-right and bottom-left corners: radial washes of the logo colors
       that fade into the page. Plain gradients, no blur filter, because Safari clips large
       blurred shapes at the screen edge. The layer is fixed and as tall as the screen gets
       with the toolbars hidden (lvh), so it also reaches behind the iPhone toolbar */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100lvh;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 52vw 46vh at 100% 0%,
          rgba(147, 171, 227, 0.40), rgba(204, 208, 248, 0.32) 40%, rgba(240, 221, 242, 0.18) 68%, rgba(240, 221, 242, 0) 100%),
        radial-gradient(ellipse 52vw 46vh at 0% 100%,
          rgba(147, 171, 227, 0.40), rgba(204, 208, 248, 0.32) 40%, rgba(240, 221, 242, 0.18) 68%, rgba(240, 221, 242, 0) 100%);
    }
    /* the header and footer float over the page so the lettering centers on the whole window */
    header, footer { position: absolute; left: 0; right: 0; }
    header { top: 0; }
    footer { bottom: 0; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;     /* name and record both hug their top corners */
      gap: 16px;
      padding: 20px 28px 0;
      color: var(--logo);
    }
    .home { display: block; }
    .home img { display: block; width: 48px; height: 48px; margin: -4px; }  /* logo art has a little built-in padding */
    .intro-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .hello img { display: block; width: 210px; height: auto; margin-left: -4px; }  /* hand-lettered name */
    .intro { max-width: 360px; font-size: var(--text); line-height: var(--text-lh); }
    .intro + .intro { margin-top: -6px; }  /* cancel the column gap so the intro lines are evenly spaced */
    .intro em { font-style: italic; }
    .intro .star { font-size: 0.8em; }  /* the solid star reads heavy at full size */
    .intro a {  /* links in the intro: same color, with a faint underline that darkens on hover */
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--cursor);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color 0.2s, text-decoration-color 0.2s;
    }
    .intro a:hover { color: var(--logo-hover); text-decoration-color: currentColor; }
    main {
      min-height: 100vh;
      padding: 140px 0;            /* equal room top and bottom keeps it centered and clear of the header/footer */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    main picture { display: block; width: 100%; }
    main img { width: 100%; height: auto; display: block; }
    .replay {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;        /* buttons don't pick up the page font on their own */
      font-size: var(--text);
      font-style: italic;
      text-transform: lowercase;
      color: var(--logo);
      background: none;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .replay:hover { color: var(--logo-hover); }
    /* hidden (but keeping its space) until the first play of the lettering finishes */
    .replay.waiting { opacity: 0; visibility: hidden; }
    .replay { transition: color 0.2s, opacity 0.2s ease, visibility 0.2s; }
    .replay svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .replay.spin svg { animation: spin 0.5s ease; }
    @keyframes spin { to { transform: rotate(-360deg); } }

    /* custom cursor: a translucent dot in the logo color that snaps into a rounded highlight
       around buttons and links, like the iPad pointer */
    :root { --cursor: rgba(147, 171, 227, 0.45); --cursor-snap: rgba(147, 171, 227, 0.16);  /* --logo #93abe3 */ }
    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      border-radius: 50%;
      background: var(--cursor);
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }
    .cursor.visible { opacity: 1; }
    .cursor.snapped { background: var(--cursor-snap); }
    @media (hover: hover) and (pointer: fine) {
      body.has-cursor, body.has-cursor * { cursor: none; }
    }
    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;            /* everything sits on one shared bottom line */
      gap: 16px;
      padding: 24px 32px;
      font-size: var(--text);
      line-height: var(--text-lh);
      color: var(--logo);
    }
    .corner { justify-self: start; display: flex; align-items: flex-end; gap: 12px; }
    .clock { display: flex; flex-direction: column; }
    .clock-time { font-variant-numeric: lining-nums tabular-nums; }
    .clock-place { font-style: italic; }
    .credit { justify-self: center; text-align: center; }
    .credit i { font-style: italic; }
    .credit .sun { padding-left: 0.6em; }  /* the little mark hangs left over the space, so add room */
    .socials {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 4px;          /* icons rest on the text baseline, not below it */
    }
    /* phones: stack the three parts, centered */
    /* phones */
    @media (max-width: 640px) {
      /* top: smaller name + intro, Spotify record lined up with the top */
      header { padding: 16px 16px 0; }
      .hello img { width: 140px; }
      :root { --text: 15px; --text-lh: 19px; }
      .intro { max-width: 190px; }
      .intro-wrap { flex: none; }
      .now-playing { min-width: 0; }

      /* bottom: one compact row hugging the bottom edge - clock on the left, icons on the right */
      footer { grid-template-columns: 1fr auto; align-items: end; padding: 0 16px 10px; }
      .credit, footer .home { display: none; }  /* no room for the progress or the logo on a phone */
      .clock-place { opacity: 0.8; }
      .socials { gap: 10px; margin-bottom: 3px; }  /* icon bottoms sit on the text baseline */
    }
    :root { --logo: #93abe3; --logo-hover: #6f8fd6; }
    .logo {
      display: block;
      width: 28px;
      height: 28px;
      fill: var(--logo);
      transition: fill 0.2s;
    }
    footer a { display: block; }
    footer a:hover .logo { fill: var(--logo-hover); }
    /* optical sizing: circles look smaller and solid shapes look bigger than outlines */
    .logo.github { width: 30px; height: 30px; }
    .logo.linkedin { width: 28px; height: 28px; }
    /* optical sizing: the wide envelope is sized to the same visual area as the square
       icons (so it's a bit shorter than them), with the same line weight as Instagram;
       negative margins trim its empty box so the spacing stays even */
    .logo.mail {
      width: 39px;
      height: 39px;
      margin: -5.4px -3.6px;
      fill: none;
      stroke: var(--logo);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }
    footer a:hover .logo.mail { fill: none; stroke: var(--logo-hover); }
    /* phones: smaller icons so they fit on the same row as the clock */
    @media (max-width: 640px) {
      .logo, .logo.linkedin { width: 18px; height: 18px; }
      .logo.github { width: 19px; height: 19px; }
      .logo.mail { width: 25.5px; height: 25.5px; margin: -3.7px -2.3px -6.9px; }  /* trims the envelope's empty box so its bottom edge lines up too */
    }
    .cutout { fill: #fff; }

  </style>

  <script>
    // An animated PNG only restarts when it's loaded under a new URL, so replay
    // swaps in a fresh blob URL of the already-downloaded file (no re-download).
    const img = document.getElementById('lettering');
    const sources = img.parentElement.querySelectorAll('source');
    let blob = null;
    let blobUrl = null;
    const replay = document.getElementById('replay');

    // How long the animation plays (until its final frame), read from the APNG's own
    // frame delays (fcTL chunks), so this stays right if the animation changes.
    function playLength(buffer) {
      const v = new DataView(buffer);
      const delays = [];
      for (let pos = 8; pos + 8 <= v.byteLength; ) {
        const len = v.getUint32(pos);
        const type = String.fromCharCode(v.getUint8(pos + 4), v.getUint8(pos + 5), v.getUint8(pos + 6), v.getUint8(pos + 7));
        if (type === 'fcTL') {
          const num = v.getUint16(pos + 8 + 20), den = v.getUint16(pos + 8 + 22) || 100;
          delays.push(1000 * num / den);
        }
        pos += 12 + len;
      }
      return delays.slice(0, -1).reduce((a, b) => a + b, 0);  // the last frame just holds
    }

    // Show the replay button once the first play has finished (it stays visible after that)
    const loaded = img.complete ? Promise.resolve() : new Promise(r => img.addEventListener('load', r, { once: true }));
    const startedAt = loaded.then(() => performance.now());
    const src = loaded.then(() => img.currentSrc);  // the wide or the stacked (phone) version
    const length = src.then(fetch)
      .then(r => r.blob())
      .then(b => { blob = b; return b.arrayBuffer(); })
      .then(playLength)
      .catch(() => 3000);  // e.g. opened as a local file: use the usual length
    Promise.all([startedAt, length]).then(([t0, ms]) => {
      const wait = Math.max(ms - (performance.now() - t0), 0);
      setTimeout(() => replay.classList.remove('waiting'), wait);
    });

    replay.addEventListener('click', async () => {
      replay.classList.remove('spin');
      void replay.offsetWidth;  // restart the icon spin
      replay.classList.add('spin');
      let url;
      if (blob) {
        if (blobUrl) URL.revokeObjectURL(blobUrl);
        url = blobUrl = URL.createObjectURL(blob);
      } else {
        url = (await src) + '?replay=' + Date.now();  // fallback, e.g. when opened as a local file
      }
      sources.forEach(s => { s.srcset = url; });  // a matching <source> wins over img.src
      img.src = url;
    });

    // East coast clock in the footer, e.g. "3:42:07 pm"
    const clock = document.getElementById('clock');
    const clockFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', second: '2-digit' });
    function tick() {
      clock.textContent = clockFormat.format(new Date()).toLowerCase();
      setTimeout(tick, 1000 - Date.now() % 1000);  // update right on the second
    }
    tick();

    // Custom cursor (mouse/trackpad only; touch devices keep their normal behavior).
    // Over a button or link it morphs into a rounded highlight around it, like the iPad pointer.
    if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const dot = document.createElement('div');
      dot.className = 'cursor';
      document.body.appendChild(dot);
      document.body.classList.add('has-cursor');

      const DOT = 12;         // dot size
      const PAD = 8;          // space around a snapped element
      const PULL = 0.12;      // how much the highlight leans toward the pointer
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const ease = reduceMotion ? 1 : 0.22;  // lower = smoother/slower

      let mouseX = 0, mouseY = 0, target = null, pressed = false;
      const cur = { x: 0, y: 0, w: DOT, h: DOT, r: DOT / 2 };

      addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        target = e.target.closest('a, button');
        if (!dot.classList.contains('visible')) {
          cur.x = mouseX - DOT / 2; cur.y = mouseY - DOT / 2;
          dot.classList.add('visible');
        }
      });
      document.addEventListener('mouseleave', () => dot.classList.remove('visible'));
      addEventListener('mousedown', () => { pressed = true; });
      addEventListener('mouseup', () => { pressed = false; });

      (function frame() {
        let goal;
        if (target) {
          const b = target.getBoundingClientRect();
          const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
          goal = {
            x: b.left - PAD + (mouseX - cx) * PULL,
            y: b.top - PAD + (mouseY - cy) * PULL,
            w: b.width + PAD * 2,
            h: b.height + PAD * 2,
            r: Math.min(14, (b.height + PAD * 2) / 2),
          };
        } else {
          goal = { x: mouseX - DOT / 2, y: mouseY - DOT / 2, w: DOT, h: DOT, r: DOT / 2 };
        }
        if (pressed) {  // squeeze slightly on click
          const k = 0.92;
          goal.x += goal.w * (1 - k) / 2; goal.y += goal.h * (1 - k) / 2;
          goal.w *= k; goal.h *= k;
        }
        for (const key in cur) cur[key] += (goal[key] - cur[key]) * ease;
        dot.style.transform = `translate(${cur.x}px, ${cur.y}px)`;
        dot.style.width = cur.w + 'px';
        dot.style.height = cur.h + 'px';
        dot.style.borderRadius = cur.r + 'px';
        dot.classList.toggle('snapped', !!target);
        requestAnimationFrame(frame);
      })();
    }
  </script>
